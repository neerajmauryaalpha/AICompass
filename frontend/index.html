<!DOCTYPE html>
<html>
<head>
  <title>AICompass</title>
  <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
<div class="bg-animation"></div>
 
<header class="glass-header">
  <h2>🧠 AICompass</h2>
</header>
 
<section class="hero">
  <h1>Explore AI Like Never Before</h1>
  <p>Learn • Understand • Question • Evolve</p>
</section>
 
<section class="news">
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
    <h2>AI Revolution</h2>
  </div>
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c">
    <h2>AI Bias</h2>
  </div>
 
  <div class="card">
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d">
    <h2>AI Ethics</h2>
  </div>
 
</section>
 
<section class="chat">
 
  <div class="suggestions">
    <button onclick="quickAsk('What is AI?')">What is AI?</button>
    <button onclick="quickAsk('Explain AI bias')">AI Bias</button>
    <button onclick="quickAsk('What is ethical AI?')">Ethics</button>
  </div>
 
  <div id="chat-box"></div>
 
  <div class="input-box">
    <input id="input" placeholder="Ask anything about AI..." />
    <button onclick="sendMessage()">➤</button>
    <button onclick="startVoice()">🎤</button>
  </div>
 
</section>
 
<script src="script.js"></script>
 
</body>
</html>
